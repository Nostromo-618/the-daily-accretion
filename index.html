<!DOCTYPE html>
<html lang="en" data-primary="teal" data-neutral="stone" data-radius="0.25" data-font="source-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d9488" />
    <!--
      Pre-hydration theme bootstrap: seed the brand defaults on first visit, then
      immediately mirror the persisted preference onto <html> so there is no
      flash of the wrong palette / light-dark mode before Vue mounts.
    -->
    <script>
      (function () {
        // Transparent storage key mapping: re-route 'vanduo-*' keys to 'tda-*'
        // for site-isolation on the same domain without interfering with vd3-docs.
        try {
          var origGet = localStorage.getItem.bind(localStorage);
          var origSet = localStorage.setItem.bind(localStorage);
          var origRemove = localStorage.removeItem.bind(localStorage);

          var mapKey = function (key) {
            if (typeof key === 'string' && key.indexOf('vanduo-') === 0) {
              var mapped = 'tda-' + key.slice(7);
              // Migration check: if mapped key is missing but original exists, copy once
              if (origGet(mapped) === null) {
                var oldVal = origGet(key);
                if (oldVal !== null) origSet(mapped, oldVal);
              }
              return mapped;
            }
            return key;
          };

          localStorage.getItem = function (key) {
            return origGet(mapKey(key));
          };
          localStorage.setItem = function (key, val) {
            return origSet(mapKey(key), val);
          };
          localStorage.removeItem = function (key) {
            return origRemove(mapKey(key));
          };
        } catch (e) {}

        // Pre-hydration theme bootstrap using isolated site keys ('tda-*')
        var DEFAULTS = {
          'tda-primary-color': 'teal',
          'tda-neutral-color': 'stone',
          'tda-radius': '0.25',
          'tda-font-preference': 'source-sans',
        };
        var el = document.documentElement;
        try {
          for (var k in DEFAULTS) {
            if (localStorage.getItem(k) === null) localStorage.setItem(k, DEFAULTS[k]);
          }
          var map = {
            'tda-primary-color': 'data-primary',
            'tda-neutral-color': 'data-neutral',
            'tda-radius': 'data-radius',
            'tda-font-preference': 'data-font',
            'tda-palette': 'data-palette',
          };
          for (var key in map) {
            var v = localStorage.getItem(key);
            if (v && v !== 'system') el.setAttribute(map[key], v);
          }
          var theme = localStorage.getItem('tda-theme-preference');
          if (theme === 'light' || theme === 'dark') {
            el.setAttribute('data-theme', theme);
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            el.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
