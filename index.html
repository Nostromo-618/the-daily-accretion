<!DOCTYPE html>
<html lang="en" data-primary="sky" data-neutral="stone" data-radius="0.5" data-font="lato">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0284c7" />
    <!--
      Pre-hydration theme bootstrap: seed the brand defaults on first visit, then
      immediately mirror the persisted preference onto <html> so there is no
      flash of the wrong palette / light-dark mode before Vue mounts.
    -->
    <script>
      (function () {
        // Transparent storage key mapping: re-route 'vanduo-*' keys to 'tda-*'
        // for site-isolation on the same domain without interfering with vd3-docs.
        try {
          var origGet = localStorage.getItem.bind(localStorage);
          var origSet = localStorage.setItem.bind(localStorage);
          var origRemove = localStorage.removeItem.bind(localStorage);

          var mapKey = function (key) {
            if (typeof key === 'string' && key.indexOf('vanduo-') === 0) {
              var mapped = 'tda-' + key.slice(7);
              // Migration check: if mapped key is missing but original exists, copy once
              if (origGet(mapped) === null) {
                var oldVal = origGet(key);
                if (oldVal !== null) origSet(mapped, oldVal);
              }
              return mapped;
            }
            return key;
          };

          localStorage.getItem = function (key) {
            return origGet(mapKey(key));
          };
          localStorage.setItem = function (key, val) {
            return origSet(mapKey(key), val);
          };
          localStorage.removeItem = function (key) {
            return origRemove(mapKey(key));
          };
        } catch (e) {}

        // Pre-hydration theme bootstrap using isolated site keys ('tda-*')
        var DEFAULTS = {
          'tda-primary-color': 'sky',
          'tda-neutral-color': 'stone',
          'tda-radius': '0.5',
          'tda-font-preference': 'lato',
        };
        var el = document.documentElement;

        // Strict binary theme: light and dark only.
        // 'system' is purely for auto-detection that sets data-theme to the resolved OS mode.
        var getSystemTheme = function () {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        };

        var resolveActiveTheme = function () {
          var pref = localStorage.getItem('tda-theme-preference');
          if (pref === 'light' || pref === 'dark') return pref;
          return getSystemTheme();
        };

        // Guard against vd3 removing data-theme on system mode:
        // Instead of removing the attribute, synchronously set it to the active resolved theme.
        var origRemove = el.removeAttribute.bind(el);
        el.removeAttribute = function (attr) {
          if (attr === 'data-theme') {
            var pref = localStorage.getItem('tda-theme-preference');
            var target = (pref === 'light' || pref === 'dark') ? pref : getSystemTheme();
            this.setAttribute('data-theme', target);
            return;
          }
          return origRemove(attr);
        };

        try {
          for (var k in DEFAULTS) {
            if (localStorage.getItem(k) === null) localStorage.setItem(k, DEFAULTS[k]);
          }
          var map = {
            'tda-primary-color': 'data-primary',
            'tda-neutral-color': 'data-neutral',
            'tda-radius': 'data-radius',
            'tda-font-preference': 'data-font',
            'tda-palette': 'data-palette',
            'tda-site-dock': 'data-tda-dock',
          };
          for (var key in map) {
            var v = localStorage.getItem(key);
            if (v && v !== 'system') el.setAttribute(map[key], v);
          }
          if (!el.getAttribute('data-tda-dock')) {
            el.setAttribute('data-tda-dock', 'top');
          }
          el.setAttribute('data-theme', resolveActiveTheme());

          if (window.matchMedia) {
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            var handleSchemeChange = function (e) {
              var pref = localStorage.getItem('tda-theme-preference');
              if (pref !== 'light' && pref !== 'dark') {
                el.setAttribute('data-theme', e.matches ? 'dark' : 'light');
              }
            };
            if (mql.addEventListener) {
              mql.addEventListener('change', handleSchemeChange);
            } else if (mql.addListener) {
              mql.addListener(handleSchemeChange);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
