<!DOCTYPE html>
<html lang="en" data-primary="teal" data-neutral="stone" data-radius="0.25" data-font="source-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d9488" />
    <!--
      Pre-hydration theme bootstrap: seed the brand defaults on first visit, then
      immediately mirror the persisted preference onto <html> so there is no
      flash of the wrong palette / light-dark mode before Vue mounts.
    -->
    <script>
      (function () {
        var DEFAULTS = {
          'vanduo-primary-color': 'teal',
          'vanduo-neutral-color': 'stone',
          'vanduo-radius': '0.25',
          'vanduo-font-preference': 'source-sans',
        };
        var el = document.documentElement;
        try {
          for (var k in DEFAULTS) {
            if (localStorage.getItem(k) === null) localStorage.setItem(k, DEFAULTS[k]);
          }
          var map = {
            'vanduo-primary-color': 'data-primary',
            'vanduo-neutral-color': 'data-neutral',
            'vanduo-radius': 'data-radius',
            'vanduo-font-preference': 'data-font',
            'vanduo-palette': 'data-palette',
          };
          for (var key in map) {
            var v = localStorage.getItem(key);
            if (v && v !== 'system') el.setAttribute(map[key], v);
          }
          var theme = localStorage.getItem('vanduo-theme-preference');
          if (theme === 'light' || theme === 'dark') {
            el.setAttribute('data-theme', theme);
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            el.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
