<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Latest articles from The Daily Accretion. Exploring AI, consciousness, space, and the curious corners of existence.">
    <meta name="author" content="The Daily Accretion">
    <meta name="robots" content="index, follow">
    <title>Blog | The Daily Accretion</title>
    <link rel="canonical" href="https://accretion.blog/blog/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://accretion.blog/blog/">
    <meta property="og:title" content="Blog | The Daily Accretion">
    <meta property="og:description" content="Latest articles exploring AI, consciousness, and the universe.">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <!-- Theme Defaults (before framework loads) -->
    <!-- Site theme defaults (only on first visit — user changes persist) -->
    <script>
        (function () {
            var defaults = {
                'vanduo-primary-color': 'teal',
                'vanduo-neutral-color': 'stone',
                'vanduo-radius': '0.25',
                'vanduo-font-preference': 'source-sans'
            };
            for (var key in defaults) {
                if (localStorage.getItem(key) === null) {
                    localStorage.setItem(key, defaults[key]);
                }
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Nostromo-618/vanduo-framework@main/dist/vanduo.min.css">
    <link rel="stylesheet" href="../custom.css">
    <style>
        html {
            scroll-behavior: smooth;
        }

        .vd-navbar-brand {
            margin-left: 1rem;
        }

        section {
            padding: 4rem 0;
            scroll-margin-top: 80px;
        }

        .page-header {
            padding-top: 120px;
            padding-bottom: 2rem;
            text-align: center;
        }

        .blog-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .blog-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: var(--vd-btn-border-radius) var(--vd-btn-border-radius) 0 0;
        }

        .blog-meta {
            display: flex;
            gap: 1rem;
            font-size: var(--vd-font-size-sm);
            color: var(--vd-text-muted);
            margin-bottom: 0.5rem;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--vd-color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .read-more:hover {
            text-decoration: underline;
        }

        .read-more i {
            transition: transform 0.2s ease;
        }

        .read-more:hover i {
            transform: translateX(4px);
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="vd-navbar vd-navbar-fixed">
        <div class="vd-navbar-container">
            <div class="vd-navbar-brand">
                <a href="../index.html"><i class="ph-fill ph-planet"
                        style="color: var(--vd-color-primary); margin-right: 0.25em;"></i>The Daily Accretion</a>
            </div>
            <button class="vd-navbar-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <div class="vd-navbar-menu">
                <ul class="vd-navbar-nav">
                    <li><a href="../index.html" class="vd-nav-link">Home</a></li>
                    <li><a href="./" class="vd-nav-link active">Blog</a></li>
                    <li><a href="../random/" class="vd-nav-link">Random</a></li>
                    <li><a href="../about.html" class="vd-nav-link">About</a></li>
                    <!-- <li><a href="../projects/" class="vd-nav-link">Projects</a></li> -->
                </ul>
                <button class="vd-theme-customizer-trigger" data-theme-customizer-trigger
                    aria-label="Open theme customizer" style="margin-left: auto;">
                    <i class="ph ph-paint-roller"></i>
                </button>
            </div>
        </div>
    </nav>
    <!-- Page Header -->
    <div class="page-header">
        <div class="vd-container">
            <h1>Latest Articles</h1>
            <p class="vd-text-muted vd-text-lg">Recent explorations, thoughts, and musings</p>
        </div>
    </div>
    <!-- Main Content -->
    <main id="main-content">
        <div class="vd-container">
            <div class="vd-row">
                <!-- Article: AI Bliss -->
                <div class="vd-col-12 vd-col-md-6 vd-col-lg-4 mb-6">
                    <a href="ai-bliss.html" class="vd-card vd-card-glow blog-card"
                        style="text-decoration: none; display: block;">
                        <img src="../images/2_bots.png" alt="AI Bliss">
                        <div class="vd-card-body">
                            <div class="blog-meta">
                                <span><i class="ph ph-calendar"></i> Jan 25, 2026</span>
                                <span><i class="ph ph-clock"></i> 30 min read</span>
                            </div>
                            <h3 style="margin-bottom: 0.5rem;">AI Bliss</h3>
                            <p class="vd-text-muted" style="margin-bottom: 1rem;">Claude Opus 4.5 talks about "spiritual
                                adventures" of its predecessor</p>
                            <span class="read-more">Read Article <i class="ph ph-arrow-right"></i></span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/gh/Nostromo-618/vanduo-framework@main/dist/vanduo.min.js"></script>
    <script>
        Vanduo.init();
        if (window.ThemeCustomizer && window.ThemeCustomizer.DEFAULTS) {
            window.ThemeCustomizer.DEFAULTS.PRIMARY_LIGHT = 'teal';
            window.ThemeCustomizer.DEFAULTS.PRIMARY_DARK = 'teal';
            window.ThemeCustomizer.DEFAULTS.NEUTRAL = 'stone';
            window.ThemeCustomizer.DEFAULTS.RADIUS = '0.25';
            window.ThemeCustomizer.DEFAULTS.FONT = 'source-sans';
        }
    </script>
    <script src="/js/router.js"></script>
</body>

</html>
