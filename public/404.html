<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | The Daily Accretion</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
        font-family: "Lato", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #0c0a09;
        color: #e7e5e4;
      }
      @media (prefers-color-scheme: light) {
        body { background: #fafaf9; color: #1c1917; }
      }
      main { max-width: 420px; }
      .code {
        font-size: clamp(5rem, 22vw, 11rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, currentColor, #38bdf8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p { color: #a8a29e; font-size: 1.1rem; margin: 0.5rem 0 1.75rem; }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 0.4rem;
        background: #0284c7;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #0369a1; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <p>This page has drifted beyond the event horizon.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
